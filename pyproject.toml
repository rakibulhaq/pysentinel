[tool.poetry]
name = "pysentinel"
version = "0.1.5"
description = "A python package for threshold based alerting using simple configuration."
authors = [
    "Rakibul Haq <haq.rakibul@gmail.com>",
]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"
aiohttp = "^3.12.13"
aioredis = "^2.0.1"
elasticsearch = "^9.0.2"
pyyaml = "^6.0.2"

[tool.poetry.group.dev.dependencies]
black = "*"
pytest = "^8.3.5"
pytest-mock = "^3.14.1"
pytest-cov = "^6.1.1"
pytest-asyncio = "^1.0.0"
# Use conservative, bounded version ranges for developer tools to avoid surprises
# These ranges are wide enough to get recent versions while preventing major breaking releases.
ruff = ">=0.6.0,<1.0.0"
mypy = ">=1.0.0,<2.0.0"
flake8 = ">=5.0.0,<7.0.0"
pre-commit = ">=3.0.0,<4.0.0"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
pysentinel = "pysentinel.cli.cli:main"
