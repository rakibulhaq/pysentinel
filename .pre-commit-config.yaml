# Use local hooks via poetry run where appropriate. This keeps hooks consistent with the project's environment.
repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: poetry run black
        language: system
        files: "\\.py$"
      - id: ruff
        name: ruff
        entry: poetry run ruff check
        language: system
        files: "\\.py$"
      - id: mypy
        name: mypy
        entry: poetry run mypy
        language: system
        # Match `make typecheck` / CI, which only typecheck the package
        files: "^pysentinel/.*\\.py$"
